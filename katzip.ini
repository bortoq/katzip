# =============================================================================
# katzip.ini — all compression contest settings.
# -----------------------------------------------------------------------------
# HOW IT WORKS. For every file katzip runs a CONTEST: each enabled engine
# compresses the file to raw DEFLATE, the smallest verified stream wins
# (Store is the floor: anything bigger than the input is discarded).
# Only methods Store (0) and Deflate (8) are ever emitted, so archives open
# everywhere (unzip, Python zipfile, 7-Zip, Explorer, macOS).
#
# WHERE IT IS READ FROM (first hit wins):
#   1. $KATZIP_INI,   2. ./katzip.ini (working dir),   3. <binary-dir>/katzip.ini
# WHAT IS ACTUALLY USED: every run prints it first as "config: <path>"
# (or "config: (built-in defaults)"). Always check this line first!
# DEFAULTS: this file ships with built-in defaults; deleting it changes
# nothing. Unknown sections/keys are ignored. KATZIP_INI=/dev/null forces
# built-in defaults (the test suites run this way).
#
# VALUE SYNTAX. Booleans: 1/0, true/false, on/off, yes/no (case-insensitive).
# Sizes: plain bytes, or K/M/G suffix (64K, 1M, 32M; optional trailing B).
# Lists: comma-separated. '#' starts a comment (also inline).
# A min>max level range (or an empty list) disables that engine's grid
# gracefully — the contest simply continues with fewer contestants.
# =============================================================================

# -----------------------------------------------------------------------------
# [policy] — which files skip the contest entirely (stored as-is).
# These are the biggest time savers: a skipped file costs one memcpy.
# -----------------------------------------------------------------------------
[policy]
# small_file_limit (size, default 4096): files SMALLER than this never run
# the heavy engines (zopfli/enhanced) — deep optimal parsing does not pay
# off on a few KB and would dominate total runtime. They still run the
# zlib/libdeflate grids.
small_file_limit = 4096

# zopfli_size_limit (size, default 32M): files BIGGER than this never run
# zopfli/enhanced either (time/memory fence). Only zlib/libdeflate compete.
zopfli_size_limit = 32M

# entropy_limit (float 0..8 bits/byte, default 7.85): Shannon entropy above
# this means "already compressed or encrypted" — contest is skipped, file
# is stored. Lower it (e.g. 7.5) to store more aggressively (faster, slightly
# bigger on borderline files); raise towards 8.0 to force trying everything.
entropy_limit = 7.85

# entropy_sample (size, default 32768): how many leading bytes are sampled
# for the entropy estimate. Larger = more accurate on big files, marginally
# slower startup. Files shorter than 256 bytes are never judged by entropy.
entropy_sample = 32768

# store_high_entropy (bool, default on): master switch for the entropy rule.
# off = even white-noise-looking files go through the full contest (slow,
# almost always still stored afterwards).
store_high_entropy = on

# skip_extensions (list, no dots needed): already-compressed containers and
# media are stored without trying. PDF is DELIBERATELY absent — many PDFs
# are mostly text and compress well. Empty list = try everything.
# NOTE: for these names the contest is skipped, so no engine can win them.
skip_extensions = jpg, jpeg, png, gif, webp, avif, mp4, mkv, avi, mov, mp3, ogg, flac, zip, gz, bz2, xz, 7z, zst, rar, woff, woff2, mpg, mpeg, webm, opus

# -----------------------------------------------------------------------------
# [zlib] — the fast baseline (system libz).
# HONEST NOTE: on size it loses even to `7z -mx -tzip`, let alone zopfli.
# It stays because (a) it is by far the fastest DEFLATE encoder here,
# (b) for tiny/high-entropy files the heavy engines are gated off and zlib
#     is what stands between "stored" and "compressed", (c) per-level and
#     per-strategy trials occasionally catch files the others mishandle.
# Do NOT delete it — disable it here if you want to measure its contribution:
# enabled = off costs little time on big files (its grid is cheap) and shows
# you exactly which files only zlib was winning.
# -----------------------------------------------------------------------------
[zlib]
# enabled (bool, default on): master switch for all zlib trials below.
enabled = on

# min_level / max_level (ints 1..9, default 1/9): zlib compression levels
# tried against every enabled strategy. Narrow to "9/9" to keep only the
# strongest (saves ~8/9 of zlib time, loses nothing on most files).
min_level = 1
max_level = 9

# strategies (subset of: default, filtered, huffman_only, rle, fixed):
# which zlib strategies enter the contest. Costly ones (rle, fixed) are only
# tried at max_level. Fewer strategies = proportionally faster.
# fixed = fixed Huffman trees (good for tiny blocks); huffman_only = no
# matches at all (good for near-random data); rle = run-length only.
strategies = default, filtered, huffman_only, rle, fixed

# full_grid_max_size (size, default 1M): files BIGGER than this try only
# max_level x strategies (the full level sweep is not worth it up there).
full_grid_max_size = 1M

# extra_retry (bool, default on) + extra_retry_max_size (size, default 64K):
# one more level-6/default pass for tiny files (AdvanceCOMP-style retry).
# HONEST NOTE: zlib is deterministic, and level-6/default is already inside
# the main grid — this retry reproduces a byte-identical stream. It is kept
# for historical compatibility; set extra_retry = off to skip the duplicate
# work with zero size change.
extra_retry = off
extra_retry_max_size = 64K

# -----------------------------------------------------------------------------
# [libdeflate] — system libdeflate, levels 1..12.
# Often the best "cheap" engine: much faster than zopfli, frequently beats
# zlib, sometimes beats everything on mid-entropy data. If katzip was built
# without libdeflate headers, this whole section is inert (build prints
# no HAVE_LIBDEFLATE) — the contest continues without it.
# -----------------------------------------------------------------------------
[libdeflate]
# enabled (bool, default on).
enabled = on

# min_level / max_level (ints 1..12, default 1/12): levels tried one by one.
# Level 12 is the slowest/strongest; 1..6 are fast. Narrow for experiments
# (e.g. 12/12 = "only the strongest").
min_level = 1
max_level = 12

# -----------------------------------------------------------------------------
# [zopfli] — Stage 1 engine (vendored Google Zopfli, Apache-2.0).
# The deep search: optimal LZ77 parsing iterated (numiterations) over a
# block-split grid. This is where the big wins over zip -9 / 7z -mx9 come
# from — and where the hours go on big files ("speed does not matter" is
# the project rule, size is the only metric).
# MASTER SWITCH: enabled = off disables EVERYTHING zopfli-powered, including
# the whole [enhanced] second engine (it runs on the zopfli core internally).
# -----------------------------------------------------------------------------
[zopfli]
# enabled (bool, default on).
enabled = on

# Per-size iteration budget (time fence: deep search is affordable only on
# small files; --i1000 on megabytes takes hours):
#   file <= tiny_max_size  -> iter_tiny    (default 64K  -> 1000)
#   file <= small_max_size -> iter_small   (default 256K -> 200)
#   file <= med_max_size   -> iter_medium  (default 1M   -> 60)
#   larger                -> iter_large   (default        15)
# Lower any iter to trade size for speed while experimenting. 0/negative
# falls back to 15.
tiny_max_size = 64K
iter_tiny = 1000
small_max_size = 256K
iter_small = 200
med_max_size = 1M
iter_medium = 60
iter_large = 15

# splitmax_values (int list, default 15, 0): block-split caps tried per file.
# 0 = unlimited blocks. More values = more trials = slower, sometimes smaller.
# Examples: "15" (fast, single map), "5, 15, 0" (wide net).
splitmax_values = 15, 0

# last_values (int list, default 0, 1): values passed as blocksplittinglast.
# HONEST NOTE: upstream Zopfli marks this knob "no longer used", so today
# varying it only duplicates trials (harmless, costs time). Kept for
# forward-compatibility with patched cores; set "last_values = 0" to skip
# the duplicates and save ~half the Stage-1 trials.
last_values = 0

# nosplit_max_size (size, default 64K): files at/below this get one extra
# trial with block splitting fully disabled. Block headers cost bytes, so on
# small/regular files "one block" often beats a clever split. 0 = never;
# set huge (e.g. 1G) to try no-split for every size. (The [enhanced]
# trial_nosplit covers the same idea for ALL sizes — see below.)
nosplit_max_size = 64K

# -----------------------------------------------------------------------------
# [enhanced] — Stage 2 second engine (in-house C, ECT/zenzop ideas).
# Tries joint-cost-friendly alternatives the Stage-1 grid never attempts and
# keeps the best — strictly min-preserving, so it can only tie or win.
# Requires [zopfli] enabled (see MASTER SWITCH above).
# Cost: roughly doubles deep-search time on files where zopfli runs.
# -----------------------------------------------------------------------------
[enhanced]
# enabled (bool, default on): whole second engine on/off. Off = pure Stage 1.
enabled = on

# trial_fixed (bool, default on): forced fixed-tree multiblock encoding
# (OptimalFixed parse + fixed Huffman). Wins where dynamic tree overhead is
# misjudged; cheap (single deterministic run).
trial_fixed = on

# trial_nosplit (bool, default on): single-block encoding for EVERY size
# (Stage 1 tries it only below nosplit_max_size). The classic joint-cost
# fix: fewer block headers + whole-file parse. This is the trial behind the
# measured wins on medium structured files.
trial_nosplit = on

# trial_split5 (bool, default on) + split5_max (int, default 5):
# conservative split cap between 15 and unlimited — catches files where 15
# over-splits and unlimited over-splits more. Any small int works here.
trial_split5 = on
split5_max = 5

# singleblock (bool, default on) + singleblock_max_size (size, default 64K)
# + custom_iter_cap (int, default 200): parser-diversified single-block
# coding — three LZ77 front-ends (optimal / optimal-fixed / greedy) each
# encoded three ways (fixed / dynamic / RLE-shaped dynamic), winner picked
# by REAL byte size, not estimated cost. Time-fenced to small files; the
# iter cap doubles as diversification (different depth = different parse).
singleblock = on
singleblock_max_size = 64K
custom_iter_cap = 200

# split15_recode (bool, default on): own 15-block split map, then per block
# two parses (optimal + optimal-fixed) x three codings, each block's type
# chosen by real bits. ECT-style correction for Zopfli's estimated-cost
# block-type picks. Linear-ish extra cost, biggest effect on multi-block
# (medium/large) files.
split15_recode = on

# merge_blocks (bool, default on): DeflOpt-class post-pass (JarTighten -b
# idea, open): after per-block winners are chosen, try joining each adjacent
# pair and keep the merge when the joint coding is really smaller. Fixes
# over-split maps. Pure win-or-tie (verified), costs one extra rescore sweep.
merge_blocks = on

# kzip_split (bool, default on): Kzip + Rezop hybrid (adapted, in-house —
# Kzip itself cannot be vendored, Rezop is not dependable). Two FOREIGN
# split maps no optimal-based splitter produces: (a) greedy-LZ77 front-end
# + BlockSplitLZ77, (b) uniform segmentation — each rescored through the
# full per-block machinery (two parses x three codings + merge), best map
# wins. This is " чужой split-map + rescoring" without чужого code.
kzip_split = on

# recode_iters (int, default 500; 0 = follow file budget): depth of the
# per-block Optimal parses inside split15-recode and kzip-split. The split MAP does not
# depend on iterations, so a cheap grid (e.g. iter_large = 15) plus a deep
# recode (e.g. 500) beats ECT-class references at a fraction of the cost of
# running everything deep. 0 = use the same budget as the grid.
recode_iters = 500
