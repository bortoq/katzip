# Alternate profile: use zlib for large files at every level.
# One section per katzip level; configured compressor groups compete.
# See docs/deflate_settings.md for details.

[1]
# libdeflate effort (1..12). Used below zlib_after; other engines compete if configured.
libdeflate_level = 1
# Input size at which zlib replaces all configured engines. Bytes, KiB, MiB, GiB; off disables zlib.
zlib_after = 67108864
# zlib effort (1..9). Required even when zlib_after is off; then it has no effect.
zlib_level = 1

[2]
libdeflate_level = 2
zlib_after = 67108864
zlib_level = 2

[3]
libdeflate_level = 3
zlib_after = 67108864
zlib_level = 3

[4]
libdeflate_level = 5
zlib_after = 67108864
zlib_level = 5

[5]
libdeflate_level = 6
zlib_after = 67108864
zlib_level = 6

[6]
libdeflate_level = 8
zlib_after = 67108864
zlib_level = 8

[7]
# Number of iterative LZ77 cost-model optimization passes. More passes take longer.
zopfli_numiterations = 13
# Reserved ECT preset value (0..3); the vendored raw Deflate encoder does not read it.
zopfli_filter_style = 1
# Byte-size cutoff: do not try a dynamic-Huffman block at or below this size.
zopfli_skipdynamic = 80
# Try a fixed-Huffman block below this token-count cutoff; should exceed skipdynamic.
zopfli_trystatic = 1800
# Do not split a block when its source data has fewer than this many bytes.
zopfli_noblocksplit = 1000
# Do not split a block when its LZ77 stream has fewer than this many tokens.
zopfli_noblocksplitlz = 200
# Number of candidate split positions sampled in each block-splitting round.
zopfli_num = 9
# Huffman header search effort: 0 basic, 1 extended, 2 most extensive.
zopfli_searchext = 1
# 1 reuses the previous LZ77 pass cost model; 0 starts each pass afresh.
zopfli_reuse_costmodel = 1
# 1 caches matches across optimization passes; uses more memory but saves match searches.
zopfli_useCache = 1
# Per-block ECT worker option; katzip accepts only 0 in this build.
zopfli_multithreading = 0
# PNG-specific ECT tuning; katzip accepts only 0 for ordinary ZIP members.
zopfli_isPNG = 0
# Effort for replacing short matches with literals when this reduces bit cost.
zopfli_replaceCodes = 1001
# 1 runs block splitting a second time; 0 uses one splitting pass.
zopfli_twice = 0
# Additional LZ77 cost-model refinement effort (0..3).
zopfli_ultra = 1
# Match-length threshold for switching from lazy to greedy search (0..258).
zopfli_greed = 258
# 1 estimates split cost using Shannon entropy; 0 uses estimated code lengths.
zopfli_entropysplit = 0
# 1 enables additional Huffman-tree and block-header optimization.
zopfli_advanced = 1
zlib_after = 16MiB
zlib_level = 7

[8]
zopfli_numiterations = 60
zopfli_filter_style = 3
zopfli_skipdynamic = 80
zopfli_trystatic = 3000
zopfli_noblocksplit = 800
zopfli_noblocksplitlz = 100
zopfli_num = 9
zopfli_searchext = 2
zopfli_reuse_costmodel = 1
zopfli_useCache = 1
zopfli_multithreading = 0
zopfli_isPNG = 0
zopfli_replaceCodes = 1001
zopfli_twice = 0
zopfli_ultra = 1
zopfli_greed = 258
zopfli_entropysplit = 0
zopfli_advanced = 1
zlib_after = 4MiB
zlib_level = 8

[9]
zopfli_numiterations = 60
zopfli_filter_style = 3
zopfli_skipdynamic = 80
zopfli_trystatic = 3000
zopfli_noblocksplit = 800
zopfli_noblocksplitlz = 100
zopfli_num = 9
zopfli_searchext = 2
zopfli_reuse_costmodel = 1
zopfli_useCache = 1
zopfli_multithreading = 0
zopfli_isPNG = 0
zopfli_replaceCodes = 1001
zopfli_twice = 0
zopfli_ultra = 1
zopfli_greed = 258
zopfli_entropysplit = 0
zopfli_advanced = 1
# Turtle effort (1..9); values above 7 enable extra block-cost and Huffman RLE checks.
turtledeflate_i_compression_level = 9
# Maximum source bytes in one superblock; also determines major buffer allocations.
turtledeflate_i_maximum_block_size = 1000000
# Maximum Deflate subblocks allowed in one superblock (1..512).
turtledeflate_i_maximum_subblocks = 512
# Maximum outer passes that refine the subblock partition.
turtledeflate_i_max_block_splitter_iterations = 30
# Maximum inner split/merge refinement attempts per outer pass.
turtledeflate_i_max_internal_block_splitter_iterations = 100
# Number of sampled candidate positions in each coarse split search.
turtledeflate_i_block_splitter_num_points = 31
# Sample-index radius around the best candidate for the next split-search round.
turtledeflate_i_block_splitter_center_dist = 8
# Minimum search-range size for sampling; narrower ranges use direct search.
turtledeflate_i_block_splitter_min_range_for_points = 1024
# 1 tries a forced extra split when ordinary split/merge stalls; keeps it if cheaper.
turtledeflate_b_block_splitter_push_split = 1
# Lowest initial fixed-point precision tried by final LZ77 path tracing.
turtledeflate_i_min_start_fp = -6
# Highest initial fixed-point precision tried by final LZ77 path tracing.
turtledeflate_i_max_start_fp = 5
# Number of starting precisions sampled between min_start_fp and max_start_fp.
turtledeflate_i_num_start_fp = 16
# Turtle diagnostic detail (0 quiet, 1..5 progressively more verbose).
turtledeflate_i_verbose = 0
zlib_after = 2MiB
zlib_level = 9
